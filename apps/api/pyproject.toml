[project]
name = "reconproof"
version = "0.1.0"
description = "Uncertainty-aware financial reconciliation with bounded agentic investigation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "python-multipart>=0.0.17",
    "polars>=1.14",
    "rapidfuzz>=3.10",
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "python-dateutil>=2.9",
    "faker>=30.0",
    "structlog>=24.4",
    "httpx>=0.27",
    "networkx>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
]
semantic = [
    "sentence-transformers>=3.2",
]

[project.scripts]
reconproof = "reconproof.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reconproof*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["polars.*", "rapidfuzz.*", "sklearn.*", "scipy.*", "faker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
